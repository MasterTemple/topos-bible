name: Release

# Pushing a `v*` tag (matching topos-ffi's version) builds everything and publishes topos-bible to
# PyPI and npm. Running it from the Actions tab only builds, so the packages can be checked first.
on:
  push:
    tags: ["v*"]
    # TEMPORARY: build-only test runs from this branch (removed before merging)
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

env:
  BOLTFFI_VERSION: 0.31.0
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/topos-ffi/Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

  # manylinux containers make wheels that run on any Linux with glibc 2.28 or later
  wheels-linux:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust and BoltFFI
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      - name: Build wheels for Python 3.10 to 3.14
        working-directory: crates/topos-ffi
        run: |
          args=()
          for version in 310 311 312 313 314; do
            args+=(--python "/opt/python/cp${version}-cp${version}/bin/python")
          done
          scripts/pack-python.sh "${args[@]}"
          auditwheel repair dist/python/wheelhouse/*.whl -w wheelhouse
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: crates/topos-ffi/wheelhouse/*.whl

  wheels-other:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS the wheels support
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Runner Pythons are universal2, but the Rust library is built for one architecture, so
      # tag (and compile) each macOS wheel for the runner's architecture only
      _PYTHON_HOST_PLATFORM: ${{ matrix.os == 'macos-latest' && 'macosx-11.0-arm64' || matrix.os == 'macos-15-intel' && 'macosx-11.0-x86_64' || '' }}
      ARCHFLAGS: ${{ matrix.os == 'macos-latest' && '-arch arm64' || matrix.os == 'macos-15-intel' && '-arch x86_64' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi*
          key: boltffi-${{ env.BOLTFFI_VERSION }}-${{ matrix.os }}
      - name: Install BoltFFI
        shell: bash
        run: command -v boltffi || cargo install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      # htmloc (a git dependency of topos-formats) has a file name with `?`, which Windows cannot
      # check out; topos-ffi does not need it, so leave those members out of the workspace
      - name: Skip members that need htmloc
        if: runner.os == 'Windows'
        shell: bash
        run: sed -i '/"crates\/topos-formats"/d; /"crates\/topos-cli"/d' Cargo.toml
      - name: Build the wheel
        shell: bash
        working-directory: crates/topos-ffi
        run: scripts/pack-python.sh --python python
      - name: Check the wheel's platform tag
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls crates/topos-ffi/dist/python/wheelhouse
          ls crates/topos-ffi/dist/python/wheelhouse | grep -q "macosx_11_0_$(uname -m)\.whl$"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: crates/topos-ffi/dist/python/wheelhouse/*.whl

  npm-package:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi*
          key: boltffi-${{ env.BOLTFFI_VERSION }}-ubuntu
      # wasm-opt comes from the binaryen npm package (Ubuntu's is too old)
      - name: Install BoltFFI
        run: command -v boltffi || cargo install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      - name: Build the package and run the example against it
        working-directory: crates/topos-ffi
        run: |
          npm install
          npm run pack:wasm
          cd examples/node && npm install && npm start
      - uses: actions/upload-artifact@v5
        with:
          name: npm-package
          path: crates/topos-ffi/dist/wasm/pkg

  # Both publish with trusted publishing (OpenID Connect), so no tokens are stored
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels-linux, wheels-other]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: npm-package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: pkg
      - run: npm publish ./pkg --access public --provenance
