[workspace]
members = [
    "crates/topos-cli",
    "crates/topos-lib",
    "crates/topos-pdf",
    "crates/topos-py",
    "crates/topos-ts",
    "crates/topos-ts-boltffi",
]
# topos-pdf needs MuPDF, which does not build everywhere; build it explicitly with `-p topos-pdf`
default-members = [
    "crates/topos-cli",
    "crates/topos-lib",
    "crates/topos-py",
    "crates/topos-ts",
    "crates/topos-ts-boltffi",
]
resolver = "3"

[workspace.dependencies]
itertools = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
regex = "1.12.3"
once_cell = "1.21.3"
htmloc = { git = "https://github.com/MasterTemple/htmloc", rev = "66698c8d87f817ad229943ced276a49efa5cd11a" }
thiserror = "2.0.18"
