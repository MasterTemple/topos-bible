[workspace]
members = [
    "crates/topos-cli",
    "crates/topos-lib",
    "crates/topos-parser",
    "crates/topos-ts",
    "crates/topos-py", "crates/topos-pdf", "crates/topos-ts-boltffi",
]
resolver = "3"

[workspace.dependencies]
itertools = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
regex = "1.12.3"
once_cell = "1.21.3"
htmloc = { git = "https://github.com/MasterTemple/htmloc" }
thiserror = "2.0.18"
