[workspace]
members = [
    "crates/topos-cli",
    "crates/topos-ffi",
    "crates/topos-formats",
    "crates/topos-lib",
    "crates/topos-lsp",
]
resolver = "3"

[workspace.package]
license = "CC0-1.0"
repository = "https://github.com/MasterTemple/topos-bible"

[workspace.dependencies]
itertools = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
regex = "1.12.3"
once_cell = "1.21.3"
htmloc = { git = "https://github.com/MasterTemple/htmloc", rev = "66698c8d87f817ad229943ced276a49efa5cd11a" }
thiserror = "2.0.18"
