[package]
name = "topos-lsp"
version = "0.4.0"
publish = false
edition = "2024"
license.workspace = true
repository.workspace = true
description = "A language server for Bible references: completion, hover, symbols, and diagnostics"

[[bin]]
name = "topos-lsp"
path = "src/main.rs"

[dependencies]
ignore = "0.4.23"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
topos-bible = { path = "../topos-lib" }
topos-bible-index = { path = "../topos-index", default-features = false, features = ["files"] }
