[package]
name = "topos-lsp"
version = "0.3.0"
publish = false
edition = "2024"
license.workspace = true
repository.workspace = true
description = "A language server for Bible references: completion, hover, symbols, and diagnostics"

[[bin]]
name = "topos-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { workspace = true }
serde_json = { workspace = true }
topos-bible = { path = "../topos-lib" }
