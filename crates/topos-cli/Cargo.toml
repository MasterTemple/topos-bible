[package]
name = "topos-bible-cli"
version = "0.4.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Find Bible references in files, like ripgrep"

[[bin]]
name = "topos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
ignore = "0.4.23"
mupdf = { version = "0.8.0", optional = true }
topos-bible = { path = "../topos-lib", version = "0.4.0" }
topos-bible-formats = { path = "../topos-formats", version = "0.4.0" }

# workspace dependencies
serde = { workspace = true }
toml = "1.1"
serde_json = { workspace = true }
shlex = "1"
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
postcard = { version = "1", features = ["use-std"] }

[dev-dependencies]
# Builds a small EPUB for the tests
zip = { version = "3.0.0", default-features = false }

[features]
# Search PDFs (builds MuPDF)
pdf = ["topos-bible-formats/pdf", "dep:mupdf"]
