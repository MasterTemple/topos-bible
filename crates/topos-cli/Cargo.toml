[package]
name = "topos-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Find Bible references in files, like ripgrep"

[[bin]]
name = "topos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
ignore = "0.4.23"
mupdf = { version = "0.8.0", optional = true }
topos-formats = { path = "../topos-formats" }
topos-lib = { path = "../topos-lib" }

# workspace dependencies
serde = { workspace = true }
toml = "1.1"
serde_json = { workspace = true }
shlex = "1"

[features]
# Search PDFs (builds MuPDF)
pdf = ["topos-formats/pdf", "dep:mupdf"]
