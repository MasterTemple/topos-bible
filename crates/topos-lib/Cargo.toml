[package]
name = "topos-bible"
version = "0.4.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Find, parse, and autocomplete Bible references in text, with exact locations"
readme = "README.md"
keywords = ["bible", "verse", "reference", "parser", "autocomplete"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
derive_more = { version = "2.0.1", features = ["deref", "deref_mut", "from", "into_iterator"] }
# A passage's segments are kept inline (nearly every passage has one or two), so indexes of
# millions of references don't make an allocation for each
smallvec = { version = "1.15", features = ["serde", "union", "const_generics"] }

# workspace dependencies
once_cell = { workspace = true }
regex = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = "0.7"
postcard = { version = "1", features = ["use-std"] }

[[bench]]
name = "search"
harness = false
