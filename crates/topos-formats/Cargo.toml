[package]
name = "topos-bible-formats"
version = "0.3.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Find Bible references in HTML, subtitles, EPUB, and PDF, with format-specific locations"
readme = "README.md"
keywords = ["bible", "verse", "epub", "subtitles", "pdf"]
categories = ["text-processing", "parser-implementations"]
# The tests use whole books and articles, which aren't ours to redistribute
exclude = ["tests"]

[dependencies]
topos-bible = { path = "../topos-lib", version = "0.3.0" }
itertools = { workspace = true }
thiserror = { workspace = true }

line-col = { version = "0.2.1", optional = true }
regex = { workspace = true, optional = true }
urlencoding = { version = "2.1.3", optional = true }
epub = { version = "2.1.5", optional = true }
roxmltree = { version = "0.21.1", optional = true }
mupdf = { version = "0.8.0", optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["html", "srt", "epub", "json", "xml"]
html = ["dep:line-col", "dep:regex", "dep:urlencoding"]
srt = []
epub = ["dep:epub", "dep:roxmltree"]
json = ["dep:serde_json"]
xml = ["dep:roxmltree"]
# Needs MuPDF to build
pdf = ["dep:mupdf"]
