[package]
name = "topos-formats"
version = "0.1.0"
edition = "2024"
description = "Find Bible references in HTML, subtitles, EPUB, and PDF, with format-specific locations"

[dependencies]
topos-lib = { path = "../topos-lib" }
itertools = { workspace = true }
thiserror = { workspace = true }

htmloc = { workspace = true, optional = true }
chumsky = { version = "0.12.0", optional = true }
epub = { version = "2.1.5", optional = true }
roxmltree = { version = "0.21.1", optional = true }
mupdf = { version = "0.8.0", optional = true }

[features]
default = ["html", "srt", "epub"]
html = ["dep:htmloc"]
srt = ["dep:chumsky"]
epub = ["dep:epub", "dep:roxmltree"]
# Needs MuPDF to build
pdf = ["dep:mupdf"]
