[package]
name = "topos-bible-index"
version = "0.4.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "A compact, persistent index of the Bible references in many files, with filtered and sorted queries"
readme = "README.md"
keywords = ["bible", "verse", "index"]
categories = ["text-processing"]

[dependencies]
topos-bible = { path = "../topos-lib", version = "0.4.0" }
topos-bible-formats = { path = "../topos-formats", version = "0.4.0", default-features = false, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
postcard = { version = "1", default-features = false, features = ["use-std"] }
miniz_oxide = "0.8"

[features]
default = ["epub"]
# Entries for EPUBs, from topos-bible-formats' CFIs
epub = ["dep:topos-bible-formats", "topos-bible-formats/epub"]
