[package]
name = "topos-ts-boltffi"

[targets.apple]
enabled = true
output = "dist/apple"
deployment_target = "16.0"
include_macos = false

[targets.apple.swift]
module_name = "ToposTsBoltffi"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.swift.type_mappings]

[targets.apple.header]

[targets.apple.xcframework]

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"
skip_package_swift = false

[targets.android]
enabled = true
output = "dist/android"
min_sdk = 24

[targets.android.kotlin]
package = "com.example.topos_ts_boltffi"
api_style = "top_level"
error_style = "throwing"
factory_style = "constructors"

[targets.android.kotlin.type_mappings]

[targets.android.header]

[targets.android.pack]

[targets.wasm]
enabled = true
triple = "wasm32-unknown-unknown"
# triple = "wasm32-wasip1"
profile = "release"
output = "dist/wasm"

[targets.wasm.optimize]
enabled = true
level = "s"          # optimize for size
strip_debug = true   # remove debug info

[targets.wasm.typescript.type_mappings]

[targets.wasm.typescript]
module_name = "topos-ts-boltffi"

[targets.wasm.npm]
package_name = "topos-ts-boltffi"
targets = ["bundler", "web", "nodejs"]
generate_package_json = true
