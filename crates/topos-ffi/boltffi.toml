experimental = []

[cargo]
global_args = []

[cargo.command_args]

[package]
# The PyPI distribution name; the Rust crate is topos-ffi
name = "topos-bible"
crate_name = "topos-ffi"

[targets.apple]
enabled = true
output = "dist/apple"
deployment_target = "16.0"
include_macos = false

[targets.apple.swift]
module_name = "Topos"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.swift.type_mappings]

[targets.apple.xcframework]

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"
skip_package_swift = false

[targets.apple.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.android]
enabled = true
output = "dist/android"
min_sdk = 24

[targets.android.kotlin]
package = "io.github.mastertemple.topos"
desktop_loader = "bundled"
api_style = "top_level"
error_style = "throwing"
factory_style = "constructors"

[targets.android.kotlin.desktop_pack]
enabled = false

[targets.android.kotlin.type_mappings]

[targets.android.header]

[targets.android.pack]

[targets.android.link]
extra_args = []

[targets.android.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.kotlin_multiplatform]
output = "dist/kotlin-multiplatform"
enabled = false
preview_prune_unsupported = false

[targets.wasm]
enabled = true
triple = "wasm32-unknown-unknown"
profile = "release"
output = "dist/wasm"

[targets.wasm.optimize]

[targets.wasm.typescript]
runtime_version = "^0.31.0"

[targets.wasm.typescript.type_mappings]

[targets.wasm.npm]
package_name = "topos-bible"
license = "CC0-1.0"
repository = "https://github.com/MasterTemple/topos"

[targets.java.jvm]
enabled = false
output = "dist/java"
strip_symbols = false

[targets.java.jvm.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.java.android]
enabled = false
output = "dist/java/android"
min_sdk = 24

[targets.dart]
output = "dist/dart"
enabled = false

[targets.python]
output = "dist/python"
enabled = true
module_name = "topos_bible"

[targets.python.wheel]

[targets.csharp]
output = "dist/csharp"
enabled = false

[targets.csharp.nuget]

[targets.c]
output = "dist/c"
enabled = false
