[package]
name = "topos-ffi"
version = "0.1.1"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Bindings for TypeScript/WASM, Python, Swift, and Kotlin (via BoltFFI)"

[lib]
# Matches the published package name (topos-bible), which BoltFFI uses for artifacts
name = "topos_bible"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
boltffi = "0.31.0"
serde_json = { workspace = true }
topos-lib = { path = "../topos-lib" }
